services:
  investigator:
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    environment:
      INVESTIGATOR_GITHUB_WEBHOOK_SECRET: ${INVESTIGATOR_GITHUB_WEBHOOK_SECRET:?required}
      INVESTIGATOR_GITLAB_WEBHOOK_TOKEN: ${INVESTIGATOR_GITLAB_WEBHOOK_TOKEN:?required}
      INVESTIGATOR_ALERTMANAGER_WEBHOOK_TOKEN: ${INVESTIGATOR_ALERTMANAGER_WEBHOOK_TOKEN:?required}
      INVESTIGATOR_ADMIN_API_TOKEN: ${INVESTIGATOR_ADMIN_API_TOKEN:?required}

  dashboard:
    environment:
      INVESTIGATOR_ADMIN_API_TOKEN: ${INVESTIGATOR_ADMIN_API_TOKEN:?required}
