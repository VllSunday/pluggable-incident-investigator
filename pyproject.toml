[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incident-investigator"
version = "0.1.0"
description = "Pluggable multi-agent investigator for CI and runtime incidents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "openai>=2.15,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]
ui = ["streamlit>=1.48,<2"]

[project.scripts]
incident-investigator = "incident_investigator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_investigator"]

[tool.pytest.ini_options]
addopts = "-q -m 'not docker'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "docker: real Docker integration test; excluded from the default unit suite",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/incident_investigator/ui/app.py" = ["E501"] # Embedded HTML/CSS is clearer unwrapped.
