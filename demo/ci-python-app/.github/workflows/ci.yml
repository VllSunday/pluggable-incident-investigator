name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checks
        run: python -m pip install pytest==8.4.2 ruff==0.12.12
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: ruff check .

