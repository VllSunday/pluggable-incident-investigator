route:
  receiver: incident-investigator
  group_wait: 1s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: incident-investigator
    webhook_configs:
      - url: http://investigator:8000/webhooks/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: runtime-demo-token
