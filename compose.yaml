services:
  investigator:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - investigator-data:/app/data

  dashboard:
    build:
      context: .
    command:
      - uv
      - run
      - --no-sync
      - streamlit
      - run
      - src/incident_investigator/ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    env_file:
      - path: .env
        required: false
    environment:
      INVESTIGATOR_API_URL: http://investigator:8000
    ports:
      - "8501:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      investigator:
        condition: service_healthy

volumes:
  investigator-data:
